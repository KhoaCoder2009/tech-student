<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tài khoản | Quản lí nề nếp</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f8fafc;--paper:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--red:#dc2626;--soft:#fff1f2;--field:#f8fafc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:var(--bg);color:var(--text);font:16px/1.5 'Inter',system-ui,sans-serif}.shell{width:min(520px,100%);padding:2rem;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(17,24,39,.1)}.brand{width:8rem;height:4.5rem;object-fit:contain;object-position:left center;margin-bottom:1rem}h1{margin:0 0 1.5rem;font:700 1.65rem/1.2 'Inter',system-ui,sans-serif}.profile{display:grid;gap:.8rem;padding:1rem;background:var(--field);border:1px solid var(--line);border-radius:12px}.row{display:flex;justify-content:space-between;gap:1rem}.label{color:var(--muted)}.value{font-weight:700;text-align:right}.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.5rem}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.7rem;padding:.5rem 1rem;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);font:600 .95rem 'Inter',sans-serif;text-decoration:none;cursor:pointer}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn:hover{border-color:#fecaca;background:var(--soft)}.btn.primary:hover{background:#b91c1c;color:#fff}.error{color:var(--red)}
</style>
<style>html,body,button,input,select,textarea,summary,table{font-family:Arial,'Segoe UI',sans-serif!important}</style>
</head>
<body>
<main class="shell">
  <img class="brand" src="logo.png" alt="Quản lí nề nếp">
  <h1>Tài khoản</h1>
  <section class="profile" aria-label="Thông tin tài khoản">
    <div class="row"><span class="label">Họ tên</span><span class="value" id="name">Đang tải...</span></div>
    <div class="row"><span class="label">Tài khoản</span><span class="value" id="email">Đang tải...</span></div>
    <div class="row"><span class="label">Vai trò</span><span class="value" id="role">Đang tải...</span></div>
  </section>
  <p class="error" id="error" role="alert"></p>
  <div class="actions"><a class="btn" href="index.html">Về trang chính</a><button class="btn primary" id="logout" type="button">Đăng xuất</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
(function(){'use strict';var labels={teacher:'Giáo viên',class_monitor:'Lớp trưởng',academic_monitor:'Lớp phó học tập',secretary:'Bí thư đoàn',student:'Thành viên'},client=window.supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.anonKey),error=document.querySelector('#error');
client.auth.getSession().then(async function(result){if(!result.data.session){window.location.replace('login.html');return;}var profile=await client.from('profiles').select('display_name,role').eq('id',result.data.session.user.id).maybeSingle();if(profile.error||!profile.data){error.textContent='Không tải được thông tin tài khoản.';return;}document.querySelector('#name').textContent=profile.data.display_name;document.querySelector('#email').textContent=result.data.session.user.email||'';document.querySelector('#role').textContent=labels[profile.data.role]||profile.data.role;});
document.querySelector('#logout').addEventListener('click',async function(){this.disabled=true;var result=await client.auth.signOut();if(result.error){error.textContent='Không thể đăng xuất.';this.disabled=false;return;}window.location.replace('login.html');});})();
</script>
</body>
</html>
