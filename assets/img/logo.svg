  <line x1="16" y1="19" x2="24" y2="19" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="22" x2="21" y2="22" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
