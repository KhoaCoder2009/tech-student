<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech-Student · Không có quyền truy cập</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/design-system.css">
<style>
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);max-width:420px;width:100%;padding:36px 30px;text-align:center;}
.ic{font-size:38px;margin-bottom:14px;}
h1{font-size:19px;margin:0 0 8px;}
p{font-size:13.5px;color:var(--ink-600);margin:0 0 22px;line-height:1.6;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="ic">🚫</div>
      <h1>Không có quyền truy cập</h1>
      <p>Tài khoản của bạn đã đăng nhập nhưng không có quyền xem trang này. Nếu bạn cho rằng đây là nhầm lẫn, hãy liên hệ quản trị viên nhà trường.</p>
      <button class="btn btn-primary" onclick="window.location.href='./login.html'">Về trang đăng nhập</button>
    </div>
  </div>
</body>
</html>
