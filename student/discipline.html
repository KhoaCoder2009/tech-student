<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech-Student · Điểm nề nếp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
<style>
.discipline-header{
  background:linear-gradient(135deg,#f59e0b 0%,#f97316 100%);
  padding:40px;
  border-radius:var(--radius-lg);
  color:#fff;
  margin-bottom:32px;
  position:relative;
  overflow:hidden;
}
.discipline-header::before{
  content:'⭐';
  position:absolute;
  font-size:180px;
  opacity:0.1;
  top:-30px;
  right:-20px;
}
.discipline-title{font-size:28px;font-weight:800;margin-bottom:8px;position:relative;z-index:1;}
.discipline-subtitle{font-size:15px;opacity:0.95;position:relative;z-index:1;}

.score-summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
  margin-bottom:32px;
}

.score-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:24px;
  text-align:center;
  transition:all 0.3s ease;
}
.score-card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 32px rgba(79,109,245,0.12);
}

.score-card.main{
  background:linear-gradient(135deg,#4f6df5 0%,#22c9a8 100%);
  color:#fff;
}

.score-label{
  font-size:13px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
  margin-bottom:12px;
  opacity:0.9;
}
.score-value{
  font-size:48px;
  font-weight:900;
  margin-bottom:4px;
  line-height:1;
}
.score-max{font-size:14px;opacity:0.8;}

.progress-ring{
  width:120px;
  height:120px;
  margin:0 auto 16px;
  position:relative;
}
.progress-ring svg{
  transform:rotate(-90deg);
}
.progress-ring circle{
  fill:none;
  stroke-width:8;
  stroke-linecap:round;
}
.progress-ring .bg{
  stroke:rgba(255,255,255,0.2);
}
.progress-ring .fg{
  stroke:#fff;
  stroke-dasharray:283;
  stroke-dashoffset:0;
  transition:stroke-dashoffset 1s ease;
}

.history-section{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:28px;
}

.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
  padding-bottom:16px;
  border-bottom:2px solid var(--line);
}
.section-title{
  font-size:20px;
  font-weight:700;
  color:var(--ink-900);
  display:flex;
  align-items:center;
  gap:8px;
}
.filter-tabs{
  display:flex;
  gap:8px;
}
.filter-tab{
  padding:8px 16px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--card);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.2s;
}
.filter-tab.active{
  background:#4f6df5;
  color:#fff;
  border-color:#4f6df5;
}

.timeline{
  position:relative;
  padding-left:40px;
}
.timeline::before{
  content:'';
  position:absolute;
  left:15px;
  top:0;
  bottom:0;
  width:2px;
  background:var(--line);
}

.timeline-item{
  position:relative;
  padding-bottom:32px;
}
.timeline-item:last-child{padding-bottom:0;}

.timeline-dot{
  position:absolute;
  left:-25px;
  top:4px;
  width:12px;
  height:12px;
  border-radius:50%;
  border:3px solid;
  background:var(--card);
}
.timeline-dot.violation{border-color:#ef4444;}
.timeline-dot.reward{border-color:#22c9a8;}

.timeline-card{
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px;
  transition:all 0.2s;
}
.timeline-card:hover{
  background:var(--card);
  box-shadow:0 4px 12px rgba(79,109,245,0.08);
}

.timeline-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}
.violation-type{
  font-size:15px;
  font-weight:700;
  color:var(--ink-900);
}
.points-badge{
  padding:4px 10px;
  border-radius:6px;
  font-size:12px;
  font-weight:700;
}
.points-badge.negative{
  background:#fef2f2;
  color:#ef4444;
}
.points-badge.positive{
  background:#ecfdf5;
  color:#22c9a8;
}

.timeline-content{
  font-size:14px;
  color:var(--ink-600);
  margin-bottom:8px;
  line-height:1.6;
}
.timeline-meta{
  display:flex;
  align-items:center;
  gap:16px;
  font-size:12px;
  color:var(--ink-500);
}
.timeline-meta span{
  display:flex;
  align-items:center;
  gap:4px;
}

.empty-state{
  text-align:center;
  padding:60px 20px;
  color:var(--ink-500);
}
.empty-icon{font-size:64px;margin-bottom:16px;opacity:0.5;}
.empty-text{font-size:16px;color:var(--ink-600);}

/* Dark mode */
body.dark-mode .score-card{
  background:var(--navy-900);
  border-color:var(--line);
}
body.dark-mode .timeline-card{
  background:var(--navy-800);
  border-color:var(--line);
}
body.dark-mode .timeline-card:hover{
  background:var(--navy-900);
}

/* Responsive */
@media(max-width:768px){
  .discipline-header{padding:28px 24px;}
  .discipline-title{font-size:22px;}
  .score-summary{grid-template-columns:1fr;}
  .history-section{padding:20px;}
  .filter-tabs{flex-wrap:wrap;}
}
</style>
</head>
<body>
<div class="shell">
  <div id="sidebar-slot"></div>
  <main class="main">
    <div id="topbar-slot"></div>
    <div class="content" id="content">

      <div class="discipline-header">
        <h1 class="discipline-title">⭐ Điểm nề nếp của bạn</h1>
        <p class="discipline-subtitle">Theo dõi điểm số và lịch sử vi phạm/khen thưởng</p>
      </div>

      <div class="score-summary">
        <div class="score-card main">
          <div class="progress-ring" id="progress-ring">
            <svg width="120" height="120">
              <circle class="bg" cx="60" cy="60" r="45"></circle>
              <circle class="fg" cx="60" cy="60" r="45" id="progress-circle"></circle>
            </svg>
            <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;">
              <div style="font-size:32px;font-weight:900;" id="current-score">--</div>
              <div style="font-size:12px;opacity:0.9;">/ 100</div>
            </div>
          </div>
          <div class="score-label">Điểm hiện tại</div>
        </div>

        <div class="score-card">
          <div class="score-label">Số lần vi phạm</div>
          <div class="score-value" style="color:#ef4444;font-size:36px;" id="violation-count">--</div>
          <div class="score-max">lần</div>
        </div>

        <div class="score-card">
          <div class="score-label">Điểm bị trừ</div>
          <div class="score-value" style="color:#f59e0b;font-size:36px;" id="deducted-points">--</div>
          <div class="score-max">điểm</div>
        </div>
      </div>

      <div class="history-section">
        <div class="section-header">
          <h2 class="section-title">
            <span>📋</span>
            <span>Lịch sử nề nếp</span>
          </h2>
          <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">Tất cả</button>
            <button class="filter-tab" data-filter="violation">Vi phạm</button>
            <button class="filter-tab" data-filter="reward">Khen thưởng</button>
          </div>
        </div>

        <div class="timeline" id="timeline">
          <div class="empty-state">
            <div class="empty-icon">📝</div>
            <div class="empty-text">Đang tải lịch sử...</div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script type="module">
import { initStudentLayout } from '../assets/js/studentLayout.js';
import { supabase } from '../assets/js/supabaseClient.js';
import { getCurrentStudent } from '../services/studentService.js';

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let allLogs = [];
let currentFilter = 'all';

async function loadDisciplineData() {
  try {
    // Get student info using service
    const student = await getCurrentStudent();
    
    if (!student) {
      throw new Error('Không tìm thấy thông tin học sinh');
    }

    // Update current score
    const currentScore = student.score || 100;
    $('#current-score').textContent = currentScore;
    
    // Update progress ring
    const circumference = 283;
    const offset = circumference - (currentScore / 100) * circumference;
    $('#progress-circle').style.strokeDashoffset = offset;

    const { data: { user } } = await supabase.auth.getUser();

    // Get discipline logs
    const { data: logs, error: logsError } = await supabase
      .from('discipline_logs')
      .select('id, violation_type, points_deducted, description, created_at, created_by')
      .eq('student_id', user.id)
      .order('created_at', { ascending: false });

    if (logsError) {
      console.error('Logs error:', logsError);
      allLogs = [];
    } else {
      allLogs = logs || [];
    }

    // Calculate stats
    const violationCount = allLogs.filter(l => l.points_deducted > 0).length;
    const totalDeducted = allLogs.reduce((sum, l) => sum + (l.points_deducted || 0), 0);

    $('#violation-count').textContent = violationCount;
    $('#deducted-points').textContent = totalDeducted.toFixed(1);

    // Render timeline
    renderTimeline();

  } catch (error) {
    console.error('Load discipline data error:', error);
    $('#timeline').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-text">Lỗi tải dữ liệu: ${error.message}</div>
      </div>
    `;
  }
}

function renderTimeline() {
  const timeline = $('#timeline');
  
  let filtered = allLogs;
  if (currentFilter === 'violation') {
    filtered = allLogs.filter(l => l.points_deducted > 0);
  } else if (currentFilter === 'reward') {
    filtered = allLogs.filter(l => l.points_deducted < 0);
  }

  if (filtered.length === 0) {
    timeline.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">✨</div>
        <div class="empty-text">${currentFilter === 'all' ? 'Chưa có lịch sử nào' : 'Không có dữ liệu phù hợp'}</div>
      </div>
    `;
    return;
  }

  timeline.innerHTML = filtered.map(log => {
    const isViolation = log.points_deducted > 0;
    const date = new Date(log.created_at);
    const formattedDate = date.toLocaleDateString('vi-VN', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric'
    });
    const formattedTime = date.toLocaleTimeString('vi-VN', {
      hour: '2-digit',
      minute: '2-digit'
    });

    return `
      <div class="timeline-item">
        <div class="timeline-dot ${isViolation ? 'violation' : 'reward'}"></div>
        <div class="timeline-card">
          <div class="timeline-header">
            <div class="violation-type">${escapeHtml(log.violation_type)}</div>
            <div class="points-badge ${isViolation ? 'negative' : 'positive'}">
              ${isViolation ? '-' : '+'}${Math.abs(log.points_deducted)} điểm
            </div>
          </div>
          ${log.description ? `<div class="timeline-content">${escapeHtml(log.description)}</div>` : ''}
          <div class="timeline-meta">
            <span>📅 ${formattedDate}</span>
            <span>🕐 ${formattedTime}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Filter tabs
$$('.filter-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    renderTimeline();
  });
});

(async () => {
  const user = await initStudentLayout({ 
    page: 'discipline', 
    title: 'Điểm nề nếp', 
    sub: 'Theo dõi điểm số của bạn'
  });
  
  if (!user) return;
  
  await loadDisciplineData();
})();
</script>
</body>
</html>
