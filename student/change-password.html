<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech-Student · Đổi mật khẩu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
<style>
.change-password-container{max-width:500px;margin:40px auto;}
.password-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow-md);}
.password-header{text-align:center;margin-bottom:32px;}
.password-icon{font-size:48px;margin-bottom:12px;}
.password-title{font-size:20px;font-weight:700;color:var(--ink-900);margin-bottom:4px;}
.password-subtitle{font-size:14px;color:var(--ink-600);}

.form-group{margin-bottom:20px;}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--ink-700);margin-bottom:8px;}
.form-input{
  width:100%;
  padding:12px 16px;
  border:2px solid var(--line);
  border-radius:var(--radius-md);
  font-family:inherit;
  font-size:14px;
  transition:all .3s ease;
  background:var(--card);
  color:var(--ink-900);
}
.form-input:focus{
  outline:none;
  border-color:#4f6df5;
  box-shadow:0 0 0 3px rgba(79,109,245,0.1);
}

.password-hint{font-size:12px;color:var(--ink-500);margin-top:4px;}
.password-strength{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden;}
.password-strength-bar{height:100%;transition:all .3s;border-radius:2px;}

body.dark-mode .password-card{
  background:var(--navy-900);
  border-color:var(--line);
}
body.dark-mode .form-input{
  background:var(--navy-800);
  border-color:var(--line);
}
</style>
</head>
<body>
<div class="shell">
  <div id="sidebar-slot"></div>
  <main class="main">
    <div id="topbar-slot"></div>
    <div class="content" id="content">

      <div class="change-password-container">
        <div class="password-card">
          <div class="password-header">
            <div class="password-icon">🔑</div>
            <h2 class="password-title">Đổi mật khẩu</h2>
            <p class="password-subtitle">Cập nhật mật khẩu đăng nhập của bạn</p>
          </div>

          <form id="form-change-password">
            <div class="form-group">
              <label class="form-label">Mật khẩu hiện tại *</label>
              <input type="password" class="form-input" name="current_password" required placeholder="Nhập mật khẩu hiện tại">
            </div>

            <div class="form-group">
              <label class="form-label">Mật khẩu mới *</label>
              <input type="password" class="form-input" name="new_password" id="new-password" required placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)">
              <div class="password-strength" id="strength-bar" style="display:none;">
                <div class="password-strength-bar"></div>
              </div>
              <p class="password-hint">Mật khẩu nên có ít nhất 6 ký tự</p>
            </div>

            <div class="form-group">
              <label class="form-label">Xác nhận mật khẩu mới *</label>
              <input type="password" class="form-input" name="confirm_password" required placeholder="Nhập lại mật khẩu mới">
            </div>

            <button type="submit" class="btn-primary" style="width:100%;margin-top:24px;">
              🔐 Đổi mật khẩu
            </button>

            <button type="button" class="btn-ghost" style="width:100%;margin-top:12px;" onclick="window.history.back()">
              Hủy
            </button>
          </form>
        </div>
      </div>

    </div>
  </main>
</div>

<script type="module">
import { initStudentLayout } from '../assets/js/studentLayout.js';
import { toast } from '../assets/js/ui.js';
import { supabase } from '../assets/js/supabaseClient.js';

const $ = s => document.querySelector(s);

// Password strength indicator
$('#new-password').addEventListener('input', (e) => {
  const password = e.target.value;
  const strengthBar = $('#strength-bar');
  const bar = strengthBar.querySelector('.password-strength-bar');
  
  if (password.length === 0) {
    strengthBar.style.display = 'none';
    return;
  }
  
  strengthBar.style.display = 'block';
  
  let strength = 0;
  if (password.length >= 6) strength += 25;
  if (password.length >= 10) strength += 25;
  if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 25;
  if (/\d/.test(password)) strength += 25;
  
  bar.style.width = strength + '%';
  bar.style.background = 
    strength < 50 ? '#ef4444' : 
    strength < 75 ? '#f59e0b' : 
    '#22c9a8';
});

$('#form-change-password').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const formData = new FormData(e.target);
  const currentPassword = formData.get('current_password');
  const newPassword = formData.get('new_password');
  const confirmPassword = formData.get('confirm_password');
  
  // Validate
  if (newPassword.length < 6) {
    toast('⚠️ Mật khẩu mới phải có ít nhất 6 ký tự', 'err');
    return;
  }
  
  if (newPassword !== confirmPassword) {
    toast('⚠️ Xác nhận mật khẩu không khớp', 'err');
    return;
  }
  
  try {
    // Verify current password by signing in
    const { data: { user } } = await supabase.auth.getUser();
    const email = user.email;
    
    const { error: signInError } = await supabase.auth.signInWithPassword({
      email: email,
      password: currentPassword
    });
    
    if (signInError) {
      toast('⚠️ Mật khẩu hiện tại không đúng', 'err');
      return;
    }
    
    // Update password
    const { error: updateError } = await supabase.auth.updateUser({
      password: newPassword
    });
    
    if (updateError) throw updateError;
    
    toast('✅ Đã đổi mật khẩu thành công');
    setTimeout(() => window.location.href = 'dashboard.html', 1500);
    
  } catch (err) {
    console.error('Change password error:', err);
    toast('⚠️ Lỗi: ' + err.message, 'err');
  }
});

(async () => {
  const user = await initStudentLayout({ 
    page: 'change-password', 
    title: 'Đổi mật khẩu', 
    sub: 'Cập nhật mật khẩu đăng nhập'
  });
  if (!user) return;
})();
</script>
</body>
</html>
