<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech-Student · Trang chủ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
<style>
.welcome-section{
  background:linear-gradient(135deg, #fff8f7 0%, #fff3f2 42%, #ffffff 100%);
  color:var(--ink-900);
  padding:32px 32px 28px;
  border-radius:26px;
  margin-bottom:28px;
  position:relative;
  overflow:hidden;
  border:1px solid #f3dadc;
  box-shadow:0 18px 42px rgba(217,71,80,0.08);
}
.welcome-section::before{
  content:'📚';
  position:absolute;
  font-size:170px;
  opacity:0.08;
  top:-26px;
  right:18px;
}
.welcome-title{
  font-size:clamp(30px, 3vw, 42px);
  font-weight:800;
  margin:0 0 8px;
  position:relative;
  z-index:1;
  letter-spacing:-0.04em;
}
.welcome-subtitle{
  font-size:17px;
  opacity:0.82;
  position:relative;
  z-index:1;
  color:var(--ink-600);
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
  gap:22px;
  margin-bottom:32px;
}

.stat-card{
  background:linear-gradient(180deg, #fff 0%, #fffaf9 100%);
  border:1px solid var(--line);
  border-radius:22px;
  padding:24px 22px;
  text-align:left;
  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
  box-shadow:0 10px 24px rgba(23,27,45,0.04);
}

.stat-card:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 36px rgba(23,27,45,0.08);
}

.stat-icon{
  width:54px;
  height:54px;
  border-radius:14px;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  background:linear-gradient(135deg, rgba(217,71,80,0.12), rgba(242,166,75,0.16));
}

.stat-value{
  font-size:32px;
  font-weight:800;
  color:var(--ink-900);
  margin-bottom:8px;
  font-family:'Sora',sans-serif;
}

.stat-label{
  font-size:13px;
  color:var(--ink-600);
  font-weight:700;
  letter-spacing:0.04em;
  text-transform:uppercase;
}

.quick-links{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
  gap:18px;
}

.link-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px 20px;
  text-decoration:none;
  transition:all 0.3s ease;
  display:flex;
  align-items:center;
  gap:18px;
  box-shadow:0 8px 20px rgba(23,27,45,0.04);
}

.link-card:hover{
  transform:translateY(-4px);
  box-shadow:0 18px 36px rgba(23,27,45,0.08);
  border-color:rgba(217,71,80,0.35);
}

.link-icon{
  width:54px;
  height:54px;
  border-radius:14px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg, rgba(217,71,80,0.10), rgba(45,183,160,0.12));
  font-size:28px;
}

.link-content{
  flex:1;
}

.link-title{
  font-size:18px;
  font-weight:700;
  color:var(--ink-900);
  margin-bottom:4px;
}

.link-desc{
  font-size:13px;
  color:var(--ink-600);
}

body.dark-mode .stat-card,
body.dark-mode .link-card{
  background:var(--navy-900);
  border-color:var(--line);
}
</style>
</head>
<body>
<div class="shell">
  <div id="sidebar-slot"></div>
  <main class="main">
    <div id="topbar-slot"></div>
    <div class="content">

      <div class="welcome-section">
        <h1 class="welcome-title">Chào mừng, <span id="student-name">Học sinh</span>!</h1>
        <p class="welcome-subtitle">THPT Bình Phú · Năm học 2024-2027</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-icon">⭐</span>
          <div class="stat-value" id="stat-discipline">--</div>
          <div class="stat-label">Điểm nề nếp</div>
        </div>

        <div class="stat-card">
          <span class="stat-icon">🗂️</span>
          <div class="stat-value" id="stat-group">--</div>
          <div class="stat-label">Tổ của bạn</div>
        </div>

        <div class="stat-card">
          <span class="stat-icon">👥</span>
          <div class="stat-value">40</div>
          <div class="stat-label">Học sinh</div>
        </div>
      </div>

      <h2 style="font-size:24px;font-weight:700;margin-bottom:20px;color:var(--ink-900);">Truy cập nhanh</h2>
      
      <div class="quick-links">
        <a href="/student/friends.html" class="link-card">
          <div class="link-icon">👥</div>
          <div class="link-content">
            <div class="link-title">Bạn bè</div>
            <div class="link-desc">Danh sách bạn cùng lớp</div>
          </div>
        </a>

        <a href="/student/mygroup.html" class="link-card">
          <div class="link-icon">🗂️</div>
          <div class="link-content">
            <div class="link-title">Tổ của tôi</div>
            <div class="link-desc">Thành viên tổ & chức vụ</div>
          </div>
        </a>

        <a href="/student/discipline.html" class="link-card">
          <div class="link-icon">⭐</div>
          <div class="link-content">
            <div class="link-title">Điểm nề nếp</div>
            <div class="link-desc">Lịch sử vi phạm</div>
          </div>
        </a>

        <a href="/student/announcements.html" class="link-card">
          <div class="link-icon">📢</div>
          <div class="link-content">
            <div class="link-title">Thông báo</div>
            <div class="link-desc">Tin tức lớp học</div>
          </div>
        </a>

        <a href="/student/profile.html" class="link-card">
          <div class="link-icon">👤</div>
          <div class="link-content">
            <div class="link-title">Hồ sơ</div>
            <div class="link-desc">Thông tin cá nhân</div>
          </div>
        </a>
      </div>

    </div>
  </main>
</div>

<script type="module">
import { initStudentLayout } from '../assets/js/studentLayout.js';
import { supabase } from '../assets/js/supabaseClient.js';
import { getCurrentStudent } from '../services/studentService.js';

async function loadStats() {
  try {
    const student = await getCurrentStudent();
    
    if (!student) return;

    const { data: { user } } = await supabase.auth.getUser();
    const { data: profile } = await supabase
      .from('profiles')
      .select('full_name')
      .eq('id', user.id)
      .maybeSingle();

    const { data: group } = await supabase
      .from('groups')
      .select('name')
      .eq('id', student.group_id)
      .maybeSingle();

    document.getElementById('student-name').textContent = profile?.full_name || 'Học sinh';
    document.getElementById('stat-discipline').textContent = student.score || 100;
    document.getElementById('stat-group').textContent = group?.name || '--';
  } catch (error) {
    console.error('Load stats error:', error);
  }
}

(async () => {
  await initStudentLayout({ 
    page: 'home', 
    title: 'Trang chủ', 
    sub: 'Dashboard học sinh'
  });
  await loadStats();
})();
</script>
</body>
</html>
