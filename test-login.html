<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Login - Debug</title>
<style>
body{font-family:sans-serif;padding:40px;max-width:800px;margin:0 auto;background:#f5f5f5;}
.box{background:white;padding:20px;border-radius:8px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
h2{margin-top:0;}
input,button{padding:10px;margin:5px 0;font-size:14px;width:100%;box-sizing:border-box;}
button{background:#4f6df5;color:white;border:none;border-radius:6px;cursor:pointer;}
button:hover{background:#3d5bd4;}
.result{margin-top:10px;padding:12px;border-radius:6px;font-size:13px;}
.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb;}
.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}
.info{background:#d1ecf1;color:#0c5460;border:1px solid #bee5eb;}
pre{background:#f8f9fa;padding:10px;border-radius:4px;overflow-x:auto;font-size:12px;}
</style>
</head>
<body>

<h1>🔍 Tech-Student Login Debug</h1>

<div class="box">
  <h2>1. Test Supabase Connection</h2>
  <button onclick="testConnection()">Test Connection</button>
  <div id="conn-result"></div>
</div>

<div class="box">
  <h2>2. Check Available Profiles</h2>
  <button onclick="listProfiles()">List All Profiles</button>
  <div id="profiles-result"></div>
</div>

<div class="box">
  <h2>3. Test Login</h2>
  <input type="text" id="test-username" placeholder="Username or email">
  <input type="password" id="test-password" placeholder="Password">
  <button onclick="testLogin()">Test Login</button>
  <div id="login-result"></div>
</div>

<div class="box">
  <h2>4. Current Session</h2>
  <button onclick="checkSession()">Check Session</button>
  <div id="session-result"></div>
</div>

<script type="module">
import { supabase, SUPABASE_URL, SUPABASE_ANON_KEY } from './assets/js/supabaseClient.js';
import { signIn, getCurrentUser, toEmail } from './services/authService.js';

window.testConnection = async function() {
  const result = document.getElementById('conn-result');
  result.innerHTML = '<div class="info">Testing connection...</div>';
  
  try {
    // Test basic query
    const { data, error } = await supabase.from('profiles').select('count', { count: 'exact', head: true });
    
    if (error) {
      result.innerHTML = `<div class="error">❌ Connection failed: ${error.message}</div>`;
    } else {
      result.innerHTML = `
        <div class="success">✅ Connected successfully!</div>
        <pre>URL: ${SUPABASE_URL}
Anon Key: ${SUPABASE_ANON_KEY.substring(0, 30)}...
Profiles count: ${data || 'N/A'}</pre>
      `;
    }
  } catch (err) {
    result.innerHTML = `<div class="error">❌ Error: ${err.message}</div>`;
  }
};

window.listProfiles = async function() {
  const result = document.getElementById('profiles-result');
  result.innerHTML = '<div class="info">Loading profiles...</div>';
  
  try {
    const { data, error } = await supabase
      .from('profiles')
      .select('id, full_name, email, role, is_active')
      .order('full_name');
    
    if (error) {
      result.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
    } else if (!data || data.length === 0) {
      result.innerHTML = '<div class="error">❌ No profiles found! You need to create accounts first.</div>';
    } else {
      const list = data.map(p => `
        <tr>
          <td>${p.full_name || 'N/A'}</td>
          <td>${p.email || 'N/A'}</td>
          <td>${p.role}</td>
          <td>${p.is_active ? '✅' : '❌'}</td>
        </tr>
      `).join('');
      
      result.innerHTML = `
        <div class="success">✅ Found ${data.length} profiles</div>
        <table style="width:100%;margin-top:10px;border-collapse:collapse;">
          <thead>
            <tr style="background:#f8f9fa;">
              <th style="text-align:left;padding:8px;">Name</th>
              <th style="text-align:left;padding:8px;">Email</th>
              <th style="text-align:left;padding:8px;">Role</th>
              <th style="text-align:left;padding:8px;">Active</th>
            </tr>
          </thead>
          <tbody>${list}</tbody>
        </table>
      `;
    }
  } catch (err) {
    result.innerHTML = `<div class="error">❌ Error: ${err.message}</div>`;
  }
};

window.testLogin = async function() {
  const result = document.getElementById('login-result');
  const username = document.getElementById('test-username').value.trim();
  const password = document.getElementById('test-password').value;
  
  if (!username || !password) {
    result.innerHTML = '<div class="error">Please enter both username and password</div>';
    return;
  }
  
  result.innerHTML = '<div class="info">Attempting login...</div>';
  
  try {
    const email = toEmail(username);
    result.innerHTML += `<div class="info">Converted to email: ${email}</div>`;
    
    const loginResult = await signIn(username, password);
    
    result.innerHTML = `
      <div class="success">✅ Login successful!</div>
      <pre>${JSON.stringify(loginResult, null, 2)}</pre>
      <div class="info">You should be redirected to: ${
        loginResult.user.role === 'admin' ? 'admin/dashboard.html' :
        loginResult.user.role === 'teacher' ? 'teacher/dashboard.html' :
        'student/home.html'
      }</div>
    `;
  } catch (err) {
    result.innerHTML = `<div class="error">❌ Login failed: ${err.message}</div>`;
  }
};

window.checkSession = async function() {
  const result = document.getElementById('session-result');
  
  try {
    const user = await getCurrentUser();
    
    if (user) {
      result.innerHTML = `
        <div class="success">✅ Session found</div>
        <pre>${JSON.stringify(user, null, 2)}</pre>
        <button onclick="clearSession()">Clear Session</button>
      `;
    } else {
      result.innerHTML = '<div class="info">No active session</div>';
    }
  } catch (err) {
    result.innerHTML = `<div class="error">❌ Error: ${err.message}</div>`;
  }
};

window.clearSession = function() {
  localStorage.removeItem('techstudent-supabase-session');
  alert('Session cleared! Reload page.');
  location.reload();
};
</script>

</body>
</html>
