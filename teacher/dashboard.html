<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech-Student · GVCN Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/design-system.css" />
    <style>
      body { margin: 0; background: var(--bg); }
      .shell { display: flex; min-height: 100vh; }
      .main { flex: 1; }
      .content { padding: 24px; }
      .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
      .title { font-size: 28px; font-weight: 800; margin: 0 0 8px; }
      .sub { color: var(--ink-600); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-top: 24px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
      .card .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-500); }
      .card .value { font-size: 28px; font-weight: 800; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div id="sidebar-slot"></div>
      <main class="main">
        <div id="topbar-slot"></div>
        <div class="content">
          <div class="panel">
            <h1 class="title">Dashboard giáo viên chủ nhiệm</h1>
            <div class="sub">Trang tổng quan cho GVCN. Các chức năng lớp chủ nhiệm có thể truy cập từ menu bên trái.</div>
            <div class="grid">
              <div class="card"><div class="label">Học sinh</div><div class="value" id="count-students">--</div></div>
              <div class="card"><div class="label">Tổ</div><div class="value" id="count-groups">--</div></div>
              <div class="card"><div class="label">Thông báo</div><div class="value" id="count-announcements">--</div></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module">
      import { initTeacherLayout } from '../assets/js/teacherLayout.js';
      import { supabase } from '../assets/js/supabaseClient.js';

      async function loadSummary() {
        try {
          const { data: { user } } = await supabase.auth.getUser();
          if (!user) return;

          const { data: classInfo } = await supabase
            .from('teachers')
            .select('homeroom_class_id')
            .eq('id', user.id)
            .maybeSingle();

          const classId = classInfo?.homeroom_class_id;
          if (!classId) return;

          const { count: students } = await supabase
            .from('students')
            .select('*', { count: 'exact', head: true })
            .eq('class_id', classId);

          const { count: groups } = await supabase
            .from('groups')
            .select('*', { count: 'exact', head: true })
            .eq('class_id', classId);

          const { count: announcements } = await supabase
            .from('announcements')
            .select('*', { count: 'exact', head: true })
            .eq('class_id', classId);

          document.getElementById('count-students').textContent = students ?? 0;
          document.getElementById('count-groups').textContent = groups ?? 0;
          document.getElementById('count-announcements').textContent = announcements ?? 0;
        } catch (error) {
          console.error('Teacher dashboard summary error:', error);
        }
      }

      await initTeacherLayout({
        page: 'dashboard',
        title: 'Dashboard',
        sub: 'Giáo viên chủ nhiệm'
      });
      await loadSummary();
    </script>
  </body>
</html>
