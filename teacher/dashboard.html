<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech-Student · GVCN Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
<style>
.welcome-header{margin-bottom:32px;}
.welcome-title{font-size:28px;font-weight:700;color:var(--navy-900);margin-bottom:4px;}
.welcome-subtitle{font-size:15px;color:var(--ink-600);}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:32px;}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);transition:all .2s;}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px;}
.stat-value{font-size:32px;font-weight:800;color:var(--navy-900);margin-bottom:4px;}
.stat-label{font-size:13px;color:var(--ink-600);font-weight:600;}
.stat-change{font-size:12px;margin-top:8px;padding:4px 8px;border-radius:6px;display:inline-block;}
.stat-change.up{background:var(--mint-100);color:var(--mint-500);}
.stat-change.down{background:var(--coral-100);color:var(--coral-500);}

.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:32px;}
.group-card{background:#fff;border:2px solid var(--line);border-radius:var(--radius-lg);padding:20px;text-align:center;cursor:pointer;transition:all .2s;}
.group-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);}
.group-icon{font-size:32px;margin-bottom:12px;}
.group-name{font-size:16px;font-weight:700;margin-bottom:8px;}
.group-count{font-size:13px;color:var(--ink-600);margin-bottom:4px;}
.group-score{font-size:24px;font-weight:700;margin-top:8px;}

.activity-list{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;}
.activity-item{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);}
.activity-item:last-child{border-bottom:none;}
.activity-time{font-size:12px;color:var(--ink-500);min-width:60px;}
.activity-content{flex:1;}
.activity-title{font-size:14px;font-weight:600;color:var(--navy-900);margin-bottom:2px;}
.activity-desc{font-size:13px;color:var(--ink-600);}

.alert-card{background:#fff;border-left:4px solid var(--amber-500);border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;}
.alert-title{font-size:14px;font-weight:700;color:var(--amber-500);margin-bottom:8px;}
.alert-list{list-style:none;padding:0;margin:0;}
.alert-list li{padding:8px 0;font-size:13px;color:var(--ink-700);border-bottom:1px solid var(--line);}
.alert-list li:last-child{border-bottom:none;}
</style>
</head>
<body>
<div class="shell">
  <div id="sidebar-slot"></div>
  <main class="main">
    <div id="topbar-slot"></div>
    <div class="content" id="content">

      <div class="welcome-header">
        <h1 class="welcome-title">Chào cô <span id="teacher-name">...</span> 👋</h1>
        <p class="welcome-subtitle"><strong>Lớp 12A2</strong> · Giáo viên chủ nhiệm</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon" style="background:var(--mint-100);color:var(--mint-500);">👥</div>
          <div class="stat-value" id="total-students">40</div>
          <div class="stat-label">Sĩ số</div>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background:#fef3c7;color:#f59e0b;">⭐</div>
          <div class="stat-value" id="discipline-avg">94.8</div>
          <div class="stat-label">Nề nếp TB</div>
          <span class="stat-change up">+1.2</span>
        </div>

        <div class="stat-card">
          <div class="stat-icon" style="background:var(--coral-100);color:var(--coral-500);">⚠️</div>
          <div class="stat-value" id="need-attention">3</div>
          <div class="stat-label">Cần chú ý</div>
        </div>
      </div>

      <h3 class="section-title">🗂️ Tổ</h3>
      <div class="groups-grid" id="groups-grid">
        <!-- Groups will be loaded here -->
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:32px;">
        <div>
          <h3 class="section-title">⚠️ Học sinh cần chú ý</h3>
          <div class="alert-card">
            <div class="alert-title">Nề nếp & Chuyên cần</div>
            <ul class="alert-list" id="alert-list">
              <li>Đang tải...</li>
            </ul>
          </div>
        </div>

        <div>
          <h3 class="section-title">📋 Hoạt động gần đây</h3>
          <div class="activity-list" id="activity-list">
            <div class="activity-item">
              <div class="activity-time">08:30</div>
              <div class="activity-content">
                <div class="activity-title">Đã cập nhật chuyên cần</div>
                <div class="activity-desc">Điểm danh buổi sáng - 40/40 học sinh</div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script type="module">
import { initTeacherLayout } from '../assets/js/teacherLayout.js';
import { supabase } from '../assets/js/supabaseClient.js';

const $ = s => document.querySelector(s);

async function loadDashboardData() {
  try {
    const { data: { user } } = await supabase.auth.getUser();
    
    // Get teacher name
    const { data: profile } = await supabase
      .from('profiles')
      .select('full_name')
      .eq('id', user.id)
      .single();
    
    $('#teacher-name').textContent = profile?.full_name || 'Giáo viên';

    // Get class data
    const { data: classData } = await supabase
      .from('classes')
      .select('id')
      .eq('name', '12A2')
      .single();

    const classId = classData?.id;

    // Get students count
    const { count: studentCount } = await supabase
      .from('students')
      .select('*', { count: 'exact', head: true })
      .eq('class_id', classId);

    $('#total-students').textContent = studentCount || 40;

    // Get groups
    const { data: groups } = await supabase
      .from('groups')
      .select('id, name, color')
      .eq('class_id', classId)
      .order('name');

    if (groups) {
      // Get student count for each group
      const groupsWithCount = await Promise.all(groups.map(async (g) => {
        const { count } = await supabase
          .from('students')
          .select('*', { count: 'exact', head: true })
          .eq('group_id', g.id);
        return { ...g, studentCount: count || 0 };
      }));

      const groupsGrid = $('#groups-grid');
      groupsGrid.innerHTML = groupsWithCount.map(g => `
        <div class="group-card" style="border-color:${g.color};" onclick="location.href='../admin/groups.html'">
          <div class="group-icon">🗂️</div>
          <div class="group-name">${g.name}</div>
          <div class="group-count">${g.studentCount} học sinh</div>
          <div class="group-score" style="color:${g.color};">95</div>
        </div>
      `).join('');
    }

    // Load students needing attention
    const { data: students } = await supabase
      .from('students')
      .select('id, student_code, discipline_score, group_id')
      .eq('class_id', classId)
      .lt('discipline_score', 80)
      .order('discipline_score', { ascending: true })
      .limit(5);

    const alertList = $('#alert-list');
    if (students && students.length > 0) {
      // Get profiles and groups for these students
      const studentIds = students.map(s => s.id);
      const groupIds = [...new Set(students.map(s => s.group_id).filter(Boolean))];
      
      const { data: profiles } = await supabase
        .from('profiles')
        .select('id, full_name')
        .in('id', studentIds);
      
      const { data: groups } = await supabase
        .from('groups')
        .select('id, name')
        .in('id', groupIds);
      
      const profileMap = {};
      profiles?.forEach(p => { profileMap[p.id] = p.full_name; });
      
      const groupMap = {};
      groups?.forEach(g => { groupMap[g.id] = g.name; });
      
      alertList.innerHTML = students.map(s => `
        <li>${profileMap[s.id] || 'N/A'} - ${groupMap[s.group_id] || 'Chưa có tổ'} - Nề nếp: ${s.discipline_score || 0} điểm</li>
      `).join('');
    } else {
      alertList.innerHTML = '<li>✅ Tất cả học sinh đều tốt</li>';
    }

  } catch (err) {
    console.error('Load dashboard error:', err);
  }
}

(async () => {
  const user = await initTeacherLayout({ 
    page: 'dashboard', 
    title: 'Tổng quan', 
    sub: 'Dashboard giáo viên chủ nhiệm'
  });
  if (!user) return;

  await loadDashboardData();
})();
</script>
</body>
</html>
