<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech-Student · Học sinh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/design-system.css">
</head>
<body>
<div class="shell">
  <div id="sidebar-slot"></div>
  <main class="main">
    <div id="topbar-slot"></div>
    <div class="content" id="content">
      <div class="toolbar">
        <div class="search-box"><span class="ic">🔎</span><input placeholder="Tìm theo mã hoặc họ tên..."></div>
        <select class="filter"><option>Tất cả tổ</option><option>Tổ 1</option><option>Tổ 2</option><option>Tổ 3</option><option>Tổ 4</option></select>
        <select class="filter"><option>Sắp xếp: Tên</option><option>Sắp xếp: Điểm nề nếp</option><option>Sắp xếp: Chuyên cần</option></select>
        <button class="btn btn-primary">＋ Thêm học sinh</button>
      </div>

      <div class="chip-tabs">
        <button class="chip-tab active">Tất cả</button>
        <button class="chip-tab">Tổ 1</button>
        <button class="chip-tab">Tổ 2</button>
        <button class="chip-tab">Tổ 3</button>
        <button class="chip-tab">Tổ 4</button>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Học sinh</th>
              <th>Tổ</th>
              <th>Chức vụ</th>
              <th>Điểm nề nếp</th>
              <th>Chuyên cần</th>
              <th style="text-align:right;">Thao tác</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><div class="stu"><div class="av" style="background:var(--g1)">A</div><div><div class="nm">Nguyễn Văn A</div><div class="cd">12A2001</div></div></div></td>
              <td><span class="badge" style="background:rgba(79,109,245,.12); color:var(--g1)"><span class="badge-dot" style="background:var(--g1)"></span>Tổ 1</span></td>
              <td><span class="badge pos-badge">Tổ viên</span></td>
              <td><span class="score good">92</span></td>
              <td>96%</td>
              <td><div class="row-actions"><button class="icon-sm">✏️</button><button class="icon-sm">👁️</button></div></td>
            </tr>
            <tr>
              <td><div class="stu"><div class="av" style="background:var(--g2)">B</div><div><div class="nm">Trần Văn B</div><div class="cd">12A2002</div></div></div></td>
              <td><span class="badge" style="background:rgba(34,201,168,.12); color:var(--g2)"><span class="badge-dot" style="background:var(--g2)"></span>Tổ 2</span></td>
              <td><span class="badge pos-badge leader">Tổ trưởng</span></td>
              <td><span class="score mid">88</span></td>
              <td>94%</td>
              <td><div class="row-actions"><button class="icon-sm">✏️</button><button class="icon-sm">👁️</button></div></td>
            </tr>
            <tr>
              <td><div class="stu"><div class="av" style="background:var(--g3)">C</div><div><div class="nm">Phạm Thị C</div><div class="cd">12A2003</div></div></div></td>
              <td><span class="badge" style="background:rgba(245,165,36,.12); color:var(--g3)"><span class="badge-dot" style="background:var(--g3)"></span>Tổ 3</span></td>
              <td><span class="badge pos-badge">Tổ viên</span></td>
              <td><span class="score good">95</span></td>
              <td>98%</td>
              <td><div class="row-actions"><button class="icon-sm">✏️</button><button class="icon-sm">👁️</button></div></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { initLayout, GVCN_NAV_ITEMS } from '../assets/js/layout.js';

(async () => {
  await initLayout({ page: 'students', title: 'Học sinh', sub: 'Quản lý học sinh lớp 12A2', allowedRoles: ['teacher'], navItems: GVCN_NAV_ITEMS });
})();
</script>
</body>
</html>
