<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Điểm nề nếp của tôi | CLASS MANAGEMENT</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f8fafc;--paper:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--red:#dc2626;--green:#15803d;--soft:#fff1f2;--field:#f8fafc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:1rem;background:var(--bg);color:var(--text);font:16px/1.5 'Inter',system-ui,sans-serif}
.container{max-width:800px;margin:0 auto}
.header{text-align:center;padding:2rem 1rem;background:linear-gradient(120deg,#fff 0%,#fff7f7 100%);border:1px solid #fecaca;border-radius:16px;margin-bottom:1.5rem}
.header img{width:5rem;height:5rem;margin-bottom:1rem}
.header h1{margin:0 0 .5rem;font-size:1.8rem}
.header .subtitle{color:var(--muted);margin:0}
.card{padding:1.5rem;background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:1.5rem;box-shadow:0 8px 20px rgba(17,24,39,.06)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat{padding:1.25rem;background:var(--field);border:1px solid var(--line);border-radius:10px;text-align:center}
.stat-value{display:block;font-size:2.2rem;font-weight:800;margin-bottom:.25rem}
.stat-value.pos{color:var(--green)}
.stat-value.neg{color:var(--red)}
.stat-label{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
h2{margin:0 0 1rem;font-size:1.3rem}
.records{display:grid;gap:.75rem}
.record{padding:1rem;background:var(--field);border:1px solid var(--line);border-radius:10px}
.record-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.record-violation{font-weight:700;color:var(--text)}
.record-points{font-weight:800;font-size:1.1rem}
.record-points.pos{color:var(--green)}
.record-points.neg{color:var(--red)}
.record-meta{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.75rem}
.record-note{margin-top:.5rem;padding:.5rem;background:var(--paper);border-radius:6px;font-size:.9rem}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.actions{display:flex;gap:.5rem;justify-content:center;margin-top:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.5rem;padding:.5rem 1rem;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--text);font:600 .9rem 'Inter',sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--soft);border-color:var(--red)}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <img src="logo.png" alt="CLASS MANAGEMENT">
    <h1 id="student-name">Đang tải...</h1>
    <p class="subtitle" id="student-id"></p>
  </header>

  <div class="stats">
    <div class="stat">
      <span class="stat-value" id="total-records">0</span>
      <span class="stat-label">Lượt ghi nhận</span>
    </div>
    <div class="stat">
      <span class="stat-value pos" id="total-plus">0</span>
      <span class="stat-label">Điểm cộng</span>
    </div>
    <div class="stat">
      <span class="stat-value neg" id="total-minus">0</span>
      <span class="stat-label">Điểm trừ</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="total-score">0</span>
      <span class="stat-label">Tổng điểm</span>
    </div>
  </div>

  <div class="card">
    <h2>📊 Lịch sử ghi nhận</h2>
    <div class="records" id="records-list">
      <div class="empty">Đang tải dữ liệu...</div>
    </div>
  </div>

  <div class="actions">
    <a class="btn" href="account.html">👤 Tài khoản</a>
    <button class="btn" id="logout" type="button">🚪 Đăng xuất</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
'use strict';
const client = window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);

let studentProfile = null;

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
}

function formatPoints(p) {
  return p < 0 ? '−' + Math.abs(p) : String(p);
}

async function loadData() {
  try {
    const session = (await client.auth.getSession()).data.session;
    if (!session) {
      window.location.replace('login.html');
      return;
    }

    // Lấy thông tin học sinh
    const profile = await client.from('profiles')
      .select('display_name, student_id, role')
      .eq('id', session.user.id)
      .maybeSingle();
    
    if (profile.error || !profile.data) {
      throw new Error('Không tải được thông tin tài khoản.');
    }

    // Nếu không phải học sinh, chuyển về trang chính
    if (profile.data.role !== 'student') {
      window.location.replace('index.html');
      return;
    }

    studentProfile = profile.data;
    document.querySelector('#student-name').textContent = studentProfile.display_name;
    document.querySelector('#student-id').textContent = 'Mã học sinh: ' + studentProfile.student_id;

    // Lấy tất cả các bản ghi vi phạm của học sinh này
    const records = await client.from('violation_records')
      .select('*')
      .eq('class_id', 'main')
      .eq('student_name', studentProfile.display_name)
      .order('occurred_on', { ascending: false });
    
    if (records.error) throw records.error;

    displayRecords(records.data || []);
  } catch (err) {
    document.querySelector('#records-list').innerHTML = 
      '<div class="empty">❌ ' + err.message + '</div>';
  }
}

function displayRecords(records) {
  const list = document.querySelector('#records-list');
  
  if (records.length === 0) {
    list.innerHTML = '<div class="empty">🎉 Chưa có ghi nhận nào. Hãy giữ vững!</div>';
    return;
  }

  // Tính toán thống kê
  let totalPlus = 0, totalMinus = 0;
  records.forEach(r => {
    if (r.points > 0) totalPlus += r.points;
    else if (r.points < 0) totalMinus += Math.abs(r.points);
  });
  const totalScore = totalPlus - totalMinus;

  document.querySelector('#total-records').textContent = records.length;
  document.querySelector('#total-plus').textContent = '+' + totalPlus;
  document.querySelector('#total-minus').textContent = '−' + totalMinus;
  
  const scoreEl = document.querySelector('#total-score');
  scoreEl.textContent = formatPoints(totalScore);
  scoreEl.className = 'stat-value ' + (totalScore > 0 ? 'pos' : (totalScore < 0 ? 'neg' : ''));

  // Hiển thị danh sách
  list.innerHTML = '';
  records.forEach(r => {
    const item = document.createElement('div');
    item.className = 'record';
    
    const header = document.createElement('div');
    header.className = 'record-header';
    
    const vio = document.createElement('span');
    vio.className = 'record-violation';
    vio.textContent = r.violation_name || 'Vi phạm';
    
    const pts = document.createElement('span');
    pts.className = 'record-points ' + (r.points > 0 ? 'pos' : (r.points < 0 ? 'neg' : ''));
    pts.textContent = formatPoints(r.points) + ' điểm';
    
    header.appendChild(vio);
    header.appendChild(pts);
    item.appendChild(header);
    
    const meta = document.createElement('div');
    meta.className = 'record-meta';
    meta.innerHTML = `
      <span>📅 ${formatDate(r.occurred_on)}</span>
      <span>🕐 ${r.session || 'Sáng'}</span>
      <span>✍️ ${r.recorded_by_name || 'Giáo viên'}</span>
    `;
    item.appendChild(meta);
    
    if (r.note) {
      const note = document.createElement('div');
      note.className = 'record-note';
      note.textContent = '💬 ' + r.note;
      item.appendChild(note);
    }
    
    list.appendChild(item);
  });
}

document.querySelector('#logout').addEventListener('click', async () => {
  await client.auth.signOut();
  window.location.replace('login.html');
});

loadData();
})();
</script>
</body>
</html>
