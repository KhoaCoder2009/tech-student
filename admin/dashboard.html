<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech-Student · Tổng quan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
<div class="shell">
  <div id="sidebar-slot"></div>
  <main class="main">
    <div id="topbar-slot"></div>
    <div class="content" id="content">

      <div class="stat-grid">
        <div class="stat-card">
          <div class="lbl">👥 Sĩ số lớp</div>
          <div class="val" id="stat-total">—</div>
          <div class="delta up" id="stat-groups-note">&nbsp;</div>
        </div>
        <div class="stat-card">
          <div class="lbl">⭐ Điểm nề nếp TB</div>
          <div class="val" id="stat-avg">—</div>
          <div class="delta up">Toàn lớp</div>
        </div>
        <div class="stat-card">
          <div class="lbl">📅 Chuyên cần</div>
          <div class="val" id="stat-att">—</div>
          <div class="delta up">Trung bình toàn lớp</div>
        </div>
        <div class="stat-card">
          <div class="lbl">⚠️ Học sinh cần chú ý</div>
          <div class="val" id="stat-vio">—</div>
          <div class="delta down">Điểm nề nếp dưới 80</div>
        </div>
      </div>

      <div class="grid-2">
        <div class="panel">
          <h3>So sánh điểm nề nếp giữa các tổ</h3>
          <div class="panel-sub">Dữ liệu hiện tại</div>
          <canvas id="groupChart" height="150"></canvas>
        </div>
        <div class="panel">
          <h3>Cần chú ý</h3>
          <div class="panel-sub">Học sinh có điểm nề nếp thấp nhất</div>
          <div class="attn-list" id="attn-list"></div>
        </div>
      </div>

      <div class="panel">
        <h3>Chi tiết theo tổ</h3>
        <div id="group-rows"></div>
      </div>

    </div>
  </main>
</div>

<script type="module">
import { initLayout } from '../assets/js/layout.js';
import { errorBanner } from '../assets/js/ui.js';
import * as studentService from '../services/studentService.js';
import * as groupService from '../services/groupService.js';

let chartInst = null;

async function loadAndRender(){
  const content = document.getElementById('content');
  try{
    const [students, groups] = await Promise.all([
      studentService.listStudents({}),
      groupService.listGroups(),
    ]);
    renderStats(students, groups);
  }catch(err){
    errorBanner(content, 'Không tải được dữ liệu tổng quan: ' + err.message, loadAndRender);
  }
}

function renderStats(students, groups){
  const total = students.length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-groups-note').textContent = `${groups.length} tổ`;

  const avg = total ? (students.reduce((a,s)=>a+s.score,0)/total).toFixed(1) : '0.0';
  document.getElementById('stat-avg').textContent = avg;

  const att = total ? Math.round(students.reduce((a,s)=>a+s.attendance,0)/total) : 0;
  document.getElementById('stat-att').textContent = att + '%';

  const attention = students.filter(s => s.score < 80);
  document.getElementById('stat-vio').textContent = attention.length;

  const rows = document.getElementById('group-rows'); rows.innerHTML = '';
  const chartLabels = [], chartData = [];
  groups.forEach(g => {
    const mem = students.filter(s => s.group_id === g.id);
    const gAvg = mem.length ? (mem.reduce((a,s)=>a+s.score,0)/mem.length).toFixed(1) : '0.0';
    chartLabels.push(g.name); chartData.push(gAvg);
    rows.insertAdjacentHTML('beforeend', `
      <div class="group-row">
        <div class="g-chip" style="background:${g.color}">${g.name.slice(-1)}</div>
        <div class="g-info"><div class="n">${g.name}</div><div class="s">${mem.length} học sinh</div></div>
        <div class="g-score">${gAvg}</div>
      </div>`);
  });

  const attn = document.getElementById('attn-list'); attn.innerHTML = '';
  if(!attention.length){
    attn.innerHTML = `<div class="empty" style="padding:24px 0;"><div class="ic">🎉</div><div class="t">Không có học sinh cần chú ý</div></div>`;
  }else{
    [...attention].sort((a,b)=>a.score-b.score).slice(0,5).forEach(s => {
      const g = groups.find(x=>x.id===s.group_id);
      attn.insertAdjacentHTML('beforeend', `
        <div class="attn-item">
          <div class="ni">${(s.name||'?').trim().slice(-1).toUpperCase()}</div>
          <div class="txt"><div class="n">${s.name}</div><div class="r">${g?g.name:''} · Điểm nề nếp ${s.score}</div></div>
        </div>`);
    });
  }

  if(chartInst) chartInst.destroy();
  chartInst = new Chart(document.getElementById('groupChart'), {
    type: 'bar',
    data: { labels: chartLabels, datasets: [{ data: chartData, backgroundColor: ['#4f6df5','#22c9a8','#f5a524','#c05fd6'], borderRadius: 8, maxBarThickness: 44 }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: false, min: 70, max: 100, grid: { color: '#eef0f6' } }, x: { grid: { display: false } } } }
  });
}

(async () => {
  const user = await initLayout({ page: 'dashboard', title: 'Tổng quan', sub: 'Lớp 12A2 · Năm học hiện tại', allowedRoles: ['admin'] });
  if(!user) return;
  loadAndRender();
})();
</script>
</body>
</html>
