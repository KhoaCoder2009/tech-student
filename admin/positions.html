<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech-Student · Chức vụ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
</head>
<body>
<div class="shell">
  <div id="sidebar-slot"></div>
  <main class="main">
    <div id="topbar-slot"></div>
    <div class="content" id="content">
      <div class="panel" style="margin-bottom:16px;">
        <h3>Chức vụ trong lớp</h3>
        <div class="panel-sub">Danh mục lấy từ bảng <code>positions</code> trong database — không hard-code. Admin có thể thêm/sửa chức vụ trực tiếp trong Supabase Table Editor cho đến khi module quản lý danh mục được xây riêng.</div>
      </div>
      <div class="pos-grid" id="pos-grid"></div>
    </div>
  </main>
</div>

<style>
.pos-card {
  position: relative;
  cursor: pointer;
  transition: all 0.2s ease;
}
.pos-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
}
.pos-tooltip {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%) translateY(-8px);
  background: var(--ink-900);
  color: white;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 100;
  max-width: 300px;
  white-space: normal;
  text-align: center;
}
.pos-tooltip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: var(--ink-900);
}
.pos-card:hover .pos-tooltip {
  opacity: 1;
}
.pos-tooltip .student-list {
  margin-top: 6px;
  font-weight: 600;
}
</style>

<script type="module">
import { initLayout } from '../assets/js/layout.js';
import { errorBanner } from '../assets/js/ui.js';
import * as studentService from '../services/studentService.js';
import * as positionService from '../services/positionService.js';

const $=(s,r=document)=>r.querySelector(s);

async function load(){
  try{
    const [positions, students] = await Promise.all([positionService.listPositions(), studentService.listStudents({})]);
    const grid = $('#pos-grid'); grid.innerHTML = '';
    
    // Tạo map: position -> [students]
    const positionMap = {};
    positions.forEach(p => positionMap[p] = []);
    students.forEach(s => {
      if(positionMap[s.position]) {
        positionMap[s.position].push(s);
      }
    });
    
    positions.forEach(p => {
      const holders = positionMap[p] || [];
      const cnt = holders.length;
      const names = holders.map(s => `${s.code} - ${s.name}`).join('<br>');
      const tooltip = cnt === 0 
        ? 'Chưa có học sinh nào giữ chức vụ này'
        : `<div class="student-list">${names}</div>`;
      
      grid.insertAdjacentHTML('beforeend', `
        <div class="pos-card">
          <div class="pos-tooltip">${tooltip}</div>
          <div><div class="nm">${p}</div><div class="cnt">${cnt} học sinh</div></div>
          <div class="num">${cnt}</div>
        </div>`);
    });
  }catch(err){
    errorBanner($('#content'), 'Không tải được danh mục chức vụ: ' + err.message, load);
  }
}

(async () => {
  const user = await initLayout({ page:'positions', title:'Chức vụ', sub:'Chức vụ học sinh trong lớp', allowedRoles:['admin'] });
  if(!user) return;
  load();
})();
</script>
</body>
</html>
