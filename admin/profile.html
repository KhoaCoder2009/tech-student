<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech-Student · Hồ sơ cá nhân</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
<style>
.profile-container{max-width:800px;margin:0 auto;}
.profile-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow-sm);margin-bottom:24px;}
.profile-header{text-align:center;padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:32px;}
.profile-avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#4f6df5,#14b8a6);color:#fff;font-size:40px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.profile-name{font-size:24px;font-weight:700;color:var(--navy-900);margin-bottom:4px;}
.profile-role{font-size:14px;color:var(--ink-600);padding:6px 16px;background:var(--mint-100);border-radius:20px;display:inline-block;}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
.form-group{margin-bottom:20px;}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--ink-700);margin-bottom:8px;}
.form-input{width:100%;padding:12px 16px;border:2px solid var(--line);border-radius:var(--radius-md);font-family:inherit;font-size:14px;transition:all .2s;}
.form-input:focus{outline:none;border-color:var(--mint-500);background:var(--mint-50);}
.form-input:disabled{background:var(--sky-50);color:var(--ink-500);cursor:not-allowed;}

.info-section{margin-bottom:32px;}
.info-title{font-size:16px;font-weight:700;color:var(--navy-900);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.info-item{padding:12px;background:var(--sky-50);border-radius:var(--radius-md);}
.info-label{font-size:12px;color:var(--ink-600);margin-bottom:4px;}
.info-value{font-size:14px;font-weight:600;color:var(--navy-900);}

@media (max-width:768px){
  .form-row,.info-grid{grid-template-columns:1fr;}
  .profile-card{padding:20px;}
}
</style>
</head>
<body>
<div class="shell">
  <div id="sidebar-slot"></div>
  <main class="main">
    <div id="topbar-slot"></div>
    <div class="content" id="content">

      <div class="profile-container">
        <div class="profile-card">
          <div class="profile-header">
            <div class="profile-avatar" id="avatar-large"></div>
            <h2 class="profile-name" id="profile-name">Đang tải...</h2>
            <span class="profile-role" id="profile-role"></span>
          </div>

          <form id="form-profile">
            <div class="info-section">
              <div class="info-title">👤 Thông tin cơ bản</div>
              
              <div class="form-group">
                <label class="form-label">Họ và tên *</label>
                <input type="text" class="form-input" name="full_name" required>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-input" name="email" disabled>
                </div>
                
                <div class="form-group">
                  <label class="form-label">Số điện thoại</label>
                  <input type="tel" class="form-input" name="phone">
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Ngày sinh</label>
                  <input type="date" class="form-input" name="date_of_birth">
                </div>
                
                <div class="form-group">
                  <label class="form-label">Giới tính</label>
                  <select class="form-input" name="gender">
                    <option value="">Chọn giới tính</option>
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Địa chỉ</label>
                <input type="text" class="form-input" name="address" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành">
              </div>
            </div>

            <div class="info-section" id="student-info" style="display:none;">
              <div class="info-title">🎓 Thông tin học tập</div>
              <div class="info-grid">
                <div class="info-item">
                  <div class="info-label">Mã học sinh</div>
                  <div class="info-value" id="student-code">—</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Lớp</div>
                  <div class="info-value" id="student-class">—</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Tổ</div>
                  <div class="info-value" id="student-group">—</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Chức vụ</div>
                  <div class="info-value" id="student-position">—</div>
                </div>
              </div>
            </div>

            <div style="display:flex;gap:12px;justify-content:flex-end;">
              <button type="button" class="btn-secondary" onclick="window.history.back()">Hủy</button>
              <button type="submit" class="btn-primary">💾 Lưu thay đổi</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>
</div>

<script type="module">
import { initLayout } from '../assets/js/layout.js';
import { toast } from '../assets/js/ui.js';
import { supabase } from '../assets/js/supabaseClient.js';

const $ = s => document.querySelector(s);

let CURRENT_USER = null;

async function loadProfile() {
  try {
    // Get current user
    const { data: { user: authUser } } = await supabase.auth.getUser();
    if (!authUser) throw new Error('Not authenticated');

    // Get profile
    const { data: profile, error: profileError } = await supabase
      .from('profiles')
      .select('*')
      .eq('id', authUser.id)
      .single();

    if (profileError) throw profileError;

    CURRENT_USER = profile;

    // Fill form
    const form = $('#form-profile');
    form.full_name.value = profile.full_name || '';
    form.email.value = profile.email || authUser.email || '';
    form.phone.value = profile.phone || '';
    form.date_of_birth.value = profile.date_of_birth || '';
    form.gender.value = profile.gender || '';
    form.address.value = profile.address || '';

    // Update header
    $('#profile-name').textContent = profile.full_name || 'Chưa cập nhật';
    $('#profile-role').textContent = profile.role === 'admin' ? 'Quản trị viên' : 
                                      profile.role === 'teacher' ? 'Giáo viên' : 'Học sinh';
    $('#avatar-large').textContent = (profile.full_name || '?').trim().slice(-1).toUpperCase();

    // If student, load student info
    if (profile.role === 'student') {
      const { data: student, error: studentError } = await supabase
        .from('students')
        .select(`
          student_code,
          class:classes(name),
          group:groups(name),
          position:student_positions(position:positions(label))
        `)
        .eq('id', authUser.id)
        .single();

      if (!studentError && student) {
        $('#student-info').style.display = 'block';
        $('#student-code').textContent = student.student_code || '—';
        $('#student-class').textContent = student.class?.name || '—';
        $('#student-group').textContent = student.group?.name || '—';
        $('#student-position').textContent = student.position?.position?.label || 'Thành viên';
      }
    }

  } catch (err) {
    console.error('Load profile error:', err);
    toast('⚠️ Lỗi tải thông tin: ' + err.message, 'err');
  }
}

$('#form-profile').addEventListener('submit', async (e) => {
  e.preventDefault();

  const formData = new FormData(e.target);
  const updates = {
    full_name: formData.get('full_name'),
    phone: formData.get('phone'),
    date_of_birth: formData.get('date_of_birth') || null,
    gender: formData.get('gender') || null,
    address: formData.get('address')
  };

  try {
    const { error } = await supabase
      .from('profiles')
      .update(updates)
      .eq('id', CURRENT_USER.id);

    if (error) throw error;

    toast('✅ Đã cập nhật thông tin');
    await loadProfile();
  } catch (err) {
    console.error('Update error:', err);
    toast('⚠️ Lỗi cập nhật: ' + err.message, 'err');
  }
});

(async () => {
  const user = await initLayout({ 
    page: 'profile', 
    title: 'Hồ sơ cá nhân', 
    sub: 'Quản lý thông tin cá nhân', 
    allowedRoles: ['admin', 'teacher', 'student'] 
  });
  if (!user) return;

  await loadProfile();
})();
</script>
</body>
</html>
