<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech-Student · Thông báo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
<style>
.announcements-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.filter-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.filter-tab{padding:8px 16px;border-radius:20px;border:2px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;display:flex;align-items:center;gap:6px;}
.filter-tab:hover{border-color:var(--mint-500);background:var(--mint-50);}
.filter-tab.active{border-color:var(--mint-500);background:var(--mint-500);color:#fff;}
.filter-tab .count{background:rgba(0,0,0,0.1);padding:2px 8px;border-radius:10px;font-size:11px;}

.announcements-grid{display:grid;gap:16px;}
.announcement-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm);transition:all .2s;}
.announcement-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.announcement-card.pinned{border-left:4px solid #f59e0b;background:linear-gradient(135deg,#fffbeb 0%,#fff 100%);}
.announcement-card.important{border-left:4px solid #ef4444;}

.announcement-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.announcement-author{display:flex;align-items:center;gap:8px;flex:1;}
.position-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;color:#fff;}
.author-name{font-size:13px;font-weight:600;color:var(--ink-700);}

.announcement-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-500);}
.announcement-actions{display:flex;gap:6px;}
.announcement-actions button{padding:6px;border-radius:8px;border:none;background:transparent;cursor:pointer;color:var(--ink-500);transition:all .2s;}
.announcement-actions button:hover{background:var(--sky-100);color:var(--sky-600);}
.btn-delete{padding:6px 10px;border-radius:8px;border:none;background:transparent;cursor:pointer;color:var(--ink-400);transition:all .2s;font-size:16px;}
.btn-delete:hover{background:var(--red-100);color:var(--red-600);transform:scale(1.1);}
.btn-pin{padding:6px 10px;border-radius:8px;border:none;background:transparent;cursor:pointer;color:var(--ink-400);transition:all .2s;font-size:16px;}
.btn-pin:hover{background:var(--amber-100);color:var(--amber-600);transform:scale(1.1);}

.announcement-title{font-size:16px;font-weight:700;color:var(--navy-900);margin-bottom:8px;line-height:1.4;}
.announcement-content{font-size:14px;color:var(--ink-700);line-height:1.6;white-space:pre-wrap;}
.announcement-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.announcement-time{font-size:12px;color:var(--ink-500);}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-500);}
.empty-state-icon{font-size:48px;margin-bottom:12px;}
.empty-state-text{font-size:15px;font-weight:600;}

/* Modal đăng thông báo */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.modal.open{display:flex;}
.modal-content{background:#fff;border-radius:var(--radius-xl);max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-size:18px;font-weight:700;color:var(--navy-900);}
.modal-close{padding:8px;border:none;background:transparent;cursor:pointer;border-radius:8px;color:var(--ink-500);}
.modal-close:hover{background:var(--red-100);color:var(--red-600);}
.modal-body{padding:24px;}

.form-group{margin-bottom:20px;}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--ink-700);margin-bottom:8px;}
.form-input,.form-textarea{width:100%;padding:10px 14px;border:2px solid var(--line);border-radius:var(--radius-md);font-family:inherit;font-size:14px;transition:all .2s;}
.form-input:focus,.form-textarea:focus{outline:none;border-color:var(--mint-500);background:var(--mint-50);}
.form-textarea{min-height:120px;resize:vertical;}
.form-checkbox{display:flex;align-items:center;gap:8px;margin-top:12px;}
.form-checkbox input{width:18px;height:18px;cursor:pointer;}

@media (max-width:768px){
  .announcements-header{flex-direction:column;align-items:flex-start;gap:12px;}
  .filter-tabs{width:100%;}
}
</style>
</head>
<body>
<div class="shell">
  <div id="sidebar-slot"></div>
  <main class="main">
    <div id="topbar-slot"></div>
    <div class="content" id="content">

      <div class="announcements-header">
        <div>
          <h1 class="page-title">📢 Thông báo lớp</h1>
          <p class="page-subtitle">Thông tin và cập nhật từ GVCN và ban cán sự</p>
        </div>
        <button class="btn-primary" id="btn-new-announcement">
          <span>➕ Đăng thông báo</span>
        </button>
      </div>

      <div class="filter-tabs" id="filter-tabs">
        <button class="filter-tab active" data-filter="all">
          📋 Tất cả
          <span class="count" id="count-all">0</span>
        </button>
        <button class="filter-tab" data-filter="GVCN">
          👨‍🏫 GVCN
          <span class="count" id="count-gvcn">0</span>
        </button>
        <button class="filter-tab" data-filter="Lớp trưởng">
          👑 Lớp trưởng
          <span class="count" id="count-lt">0</span>
        </button>
        <button class="filter-tab" data-filter="Bí thư">
          📋 Bí thư
          <span class="count" id="count-bt">0</span>
        </button>
        <button class="filter-tab" data-filter="Phó học tập">
          📚 Phó học tập
          <span class="count" id="count-pht">0</span>
        </button>
        <button class="filter-tab" data-filter="Phó lao động">
          🧹 Phó lao động
          <span class="count" id="count-pld">0</span>
        </button>
      </div>

      <div class="announcements-grid" id="announcements-list"></div>

    </div>
  </main>
</div>

<!-- Modal đăng thông báo -->
<div class="modal" id="modal-announcement">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">📝 Đăng thông báo mới</h2>
      <button class="modal-close" id="btn-close-modal">✕</button>
    </div>
    <div class="modal-body">
      <form id="form-announcement">
        <div class="form-group">
          <label class="form-label">Tiêu đề *</label>
          <input type="text" class="form-input" name="title" placeholder="Ví dụ: Nhắc nhở nộp bài tập tuần 5" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Nội dung *</label>
          <textarea class="form-textarea" name="content" placeholder="Viết nội dung thông báo..." required></textarea>
        </div>
        
        <div style="display:flex;gap:8px;margin-top:24px;">
          <button type="submit" class="btn-primary" style="flex:1;">Đăng thông báo</button>
          <button type="button" class="btn-secondary" id="btn-cancel">Hủy</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script type="module">
import { initLayout } from '../assets/js/layout.js';
import { errorBanner, toast } from '../assets/js/ui.js';
import { supabase } from '../assets/js/supabaseClient.js';
import * as announcementService from '../services/announcementService.js';

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let CLASS_ID = null;
let ANNOUNCEMENTS = [];
let CURRENT_FILTER = 'all';
let CAN_POST = false; // Quyền đăng thông báo
let CURRENT_USER = null; // Thông tin user hiện tại

function formatTime(timestamp) {
  const date = new Date(timestamp);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return 'Vừa xong';
  if (minutes < 60) return `${minutes} phút trước`;
  if (hours < 24) return `${hours} giờ trước`;
  if (days < 7) return `${days} ngày trước`;
  
  return date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function renderAnnouncements() {
  const filtered = CURRENT_FILTER === 'all' 
    ? ANNOUNCEMENTS 
    : ANNOUNCEMENTS.filter(a => a.position_label === CURRENT_FILTER);
  
  const container = $('#announcements-list');
  
  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <div class="empty-state-text">Chưa có thông báo nào</div>
      </div>`;
    return;
  }
  
  container.innerHTML = filtered.map(a => {
    const isPinned = a.is_pinned ? 'pinned' : '';
    const isImportant = a.is_important ? 'important' : '';
    const positionTag = a.position_label 
      ? `<span class="position-tag" style="background:${a.position_color};">
           ${a.position_icon} ${a.position_label}
         </span>`
      : '';
    
    // Hiển thị nút xóa nếu là người đăng hoặc admin
    const canDelete = CURRENT_USER && (a.created_by === CURRENT_USER.id || CURRENT_USER.role === 'admin');
    const canPin = CURRENT_USER && CURRENT_USER.role === 'admin';
    
    const deleteBtn = canDelete 
      ? `<button class="btn-delete" data-id="${a.id}" title="Xóa thông báo">🗑️</button>`
      : '';
    
    const pinBtn = canPin
      ? `<button class="btn-pin" data-id="${a.id}" data-pinned="${a.is_pinned}" title="${a.is_pinned ? 'Bỏ ghim' : 'Ghim'}">
           ${a.is_pinned ? '📌' : '📍'}
         </button>`
      : '';
    
    return `
      <div class="announcement-card ${isPinned} ${isImportant}" data-id="${a.id}">
        <div class="announcement-header">
          <div class="announcement-author">
            ${positionTag}
            <span class="author-name">${a.author_name || 'Không rõ'}</span>
          </div>
          <div class="announcement-meta">
            ${a.is_pinned ? '📌 Ghim' : ''}
            ${pinBtn}
            ${deleteBtn}
          </div>
        </div>
        
        <div class="announcement-title">${a.title}</div>
        <div class="announcement-content">${a.content}</div>
        
        <div class="announcement-footer">
          <span class="announcement-time">🕐 ${formatTime(a.created_at)}</span>
        </div>
      </div>`;
  }).join('');
  
  // Add delete event listeners
  $$('.btn-delete').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const announcement = ANNOUNCEMENTS.find(a => a.id === id);
      
      if (!confirm(`Xóa thông báo "${announcement.title}"?`)) return;
      
      try {
        await announcementService.deleteAnnouncement(id);
        toast('✅ Đã xóa thông báo');
        await loadAnnouncements();
      } catch (err) {
        toast('⚠️ Lỗi: ' + err.message, 'err');
      }
    });
  });
  
  // Add pin event listeners
  $$('.btn-pin').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const isPinned = btn.dataset.pinned === 'true';
      
      try {
        await announcementService.togglePinAnnouncement(id, !isPinned);
        toast(isPinned ? '📍 Đã bỏ ghim' : '📌 Đã ghim');
        await loadAnnouncements();
      } catch (err) {
        toast('⚠️ Lỗi: ' + err.message, 'err');
      }
    });
  });
  
  // Update counts
  const counts = {
    all: ANNOUNCEMENTS.length,
    gvcn: ANNOUNCEMENTS.filter(a => a.position_label === 'GVCN').length,
    lt: ANNOUNCEMENTS.filter(a => a.position_label === 'Lớp trưởng').length,
    bt: ANNOUNCEMENTS.filter(a => a.position_label === 'Bí thư').length,
    pht: ANNOUNCEMENTS.filter(a => a.position_label === 'Phó học tập').length,
    pld: ANNOUNCEMENTS.filter(a => a.position_label === 'Phó lao động').length
  };
  
  $('#count-all').textContent = counts.all;
  $('#count-gvcn').textContent = counts.gvcn;
  $('#count-lt').textContent = counts.lt;
  $('#count-bt').textContent = counts.bt;
  $('#count-pht').textContent = counts.pht;
  $('#count-pld').textContent = counts.pld;
}

async function loadAnnouncements() {
  try {
    ANNOUNCEMENTS = await announcementService.listAnnouncements(CLASS_ID);
    renderAnnouncements();
    
    // Check if user can post
    CAN_POST = await announcementService.canPostAnnouncement(CLASS_ID);
    const btnNew = $('#btn-new-announcement');
    if (!CAN_POST) {
      btnNew.style.display = 'none';
    } else {
      btnNew.style.display = 'flex';
    }
  } catch (err) {
    errorBanner($('#content'), 'Không tải được thông báo: ' + err.message, loadAnnouncements);
  }
}

// Filter tabs
$$('.filter-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    CURRENT_FILTER = tab.dataset.filter;
    renderAnnouncements();
  });
});

// Modal controls
$('#btn-new-announcement').addEventListener('click', () => {
  if (!CAN_POST) {
    alert('⚠️ Bạn không có quyền đăng thông báo.\n\nChỉ GVCN, Lớp trưởng, Bí thư, Phó học tập, Phó lao động mới được đăng thông báo.');
    return;
  }
  $('#modal-announcement').classList.add('open');
});

$('#btn-close-modal').addEventListener('click', () => {
  $('#modal-announcement').classList.remove('open');
  $('#form-announcement').reset();
});

$('#btn-cancel').addEventListener('click', () => {
  $('#modal-announcement').classList.remove('open');
  $('#form-announcement').reset();
});

// Submit form
$('#form-announcement').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const formData = new FormData(e.target);
  const data = {
    title: formData.get('title'),
    content: formData.get('content'),
    is_important: false
  };
  
  try {
    await announcementService.createAnnouncement(CLASS_ID, data);
    toast('✅ Đã đăng thông báo');
    $('#modal-announcement').classList.remove('open');
    $('#form-announcement').reset();
    await loadAnnouncements();
  } catch (err) {
    toast('⚠️ Lỗi: ' + err.message, 'err');
  }
});

// Close modal when clicking outside
$('#modal-announcement').addEventListener('click', (e) => {
  if (e.target.id === 'modal-announcement') {
    $('#modal-announcement').classList.remove('open');
  }
});

(async () => {
  const user = await initLayout({ 
    page: 'announcements', 
    title: 'Thông báo', 
    sub: 'Thông tin và cập nhật lớp học', 
    allowedRoles: ['admin', 'teacher', 'student'] 
  });
  if (!user) return;
  
  CURRENT_USER = user; // Lưu thông tin user
  
  // Get class ID
  try {
    console.log('User role:', user.role);
    console.log('User id:', user.id);
    
    if (user.role === 'admin' || user.role === 'teacher') {
      // Admin/Teacher: get class 12A2 (lấy class mới nhất nếu có nhiều)
      const { data: classData, error: classError } = await supabase
        .from('classes')
        .select('id, name')
        .eq('name', '12A2')
        .order('created_at', { ascending: false })
        .limit(1);
      
      console.log('Classes query result:', classData, classError);
      
      if (classError) throw classError;
      CLASS_ID = classData?.[0]?.id;
    } else {
      // Student: get their class
      const { data: studentData, error: studentError } = await supabase
        .from('students')
        .select('class_id')
        .eq('id', user.id);
      
      console.log('Student query result:', studentData, studentError);
      
      if (studentError) throw studentError;
      CLASS_ID = studentData?.[0]?.class_id;
    }
    
    console.log('CLASS_ID:', CLASS_ID);
    
    if (!CLASS_ID) {
      throw new Error('Không tìm thấy thông tin lớp học. Vui lòng kiểm tra database có class 12A2 chưa.');
    }
    
    await loadAnnouncements();
  } catch (err) {
    console.error('Full error:', err);
    errorBanner($('#content'), 'Lỗi tải dữ liệu: ' + err.message);
  }
})();
</script>
</body>
</html>
