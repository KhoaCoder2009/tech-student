<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech-Student · Thông báo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design-system.css">
<style>
.announcements-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;flex-wrap:wrap;gap:16px;}
.announcements-header-left{flex:1;min-width:250px;}
.announcements-header-right{display:flex;gap:12px;align-items:center;}

/* Nút đăng thông báo hiện đại */
.btn-new-announcement{
  position:relative;
  padding:12px 24px;
  background:linear-gradient(135deg,var(--mint-500),var(--sky-500));
  border:none;
  border-radius:12px;
  color:#fff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(79,109,245,0.3);
  transition:all .3s cubic-bezier(0.4,0,0.2,1);
  display:flex;
  align-items:center;
  gap:8px;
  overflow:hidden;
}
.btn-new-announcement:before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent);
  opacity:0;
  transition:opacity .3s;
}
.btn-new-announcement:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(79,109,245,0.4);
}
.btn-new-announcement:hover:before{opacity:1;}
.btn-new-announcement:active{transform:translateY(0);box-shadow:0 4px 12px rgba(79,109,245,0.3);}
.btn-new-announcement .icon{font-size:18px;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}

/* Filter tabs hiện đại */
.filter-tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:24px;
  padding:6px;
  background:rgba(247,249,252,0.8);
  border-radius:16px;
  backdrop-filter:blur(10px);
}
.filter-tab{
  padding:10px 18px;
  border-radius:12px;
  border:2px solid transparent;
  background:#fff;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  transition:all .25s cubic-bezier(0.4,0,0.2,1);
  display:flex;
  align-items:center;
  gap:8px;
  position:relative;
}
.filter-tab:hover{
  border-color:var(--mint-500);
  background:var(--mint-50);
  transform:translateY(-1px);
  box-shadow:0 2px 8px rgba(79,209,197,0.2);
}
.filter-tab.active{
  background:linear-gradient(135deg,var(--mint-500),var(--sky-500));
  color:#fff;
  box-shadow:0 4px 12px rgba(79,209,197,0.3);
  transform:translateY(-1px);
}
.filter-tab .count{
  background:rgba(0,0,0,0.15);
  padding:3px 9px;
  border-radius:12px;
  font-size:11px;
  font-weight:700;
  min-width:24px;
  text-align:center;
}
.filter-tab.active .count{background:rgba(255,255,255,0.25);}

/* Announcement cards hiện đại */
.announcements-grid{display:grid;gap:20px;}
.announcement-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:24px;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
  transition:all .3s cubic-bezier(0.4,0,0.2,1);
  position:relative;
  overflow:hidden;
}
.announcement-card:before{
  content:'';
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:linear-gradient(180deg,var(--mint-500),var(--sky-500));
  opacity:0;
  transition:opacity .3s;
}
.announcement-card:hover{
  box-shadow:0 8px 24px rgba(0,0,0,0.08);
  transform:translateY(-4px);
  border-color:var(--mint-200);
}
.announcement-card:hover:before{opacity:1;}
.announcement-card.pinned{
  border-left:4px solid #f59e0b;
  background:linear-gradient(135deg,#fffbeb 0%,#fff 100%);
  box-shadow:0 4px 16px rgba(245,158,11,0.15);
}
.announcement-card.pinned:before{background:#f59e0b;opacity:1;}
.announcement-card.important{
  border-left:4px solid #ef4444;
  background:linear-gradient(135deg,#fef2f2 0%,#fff 100%);
}
.announcement-card.important:before{background:#ef4444;opacity:1;}

.announcement-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.announcement-author{display:flex;align-items:center;gap:10px;flex:1;}
.position-tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.author-name{font-size:14px;font-weight:600;color:var(--ink-700);}

.announcement-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink-500);}
.announcement-actions{display:flex;gap:8px;}
.btn-delete,.btn-pin{
  padding:8px;
  border-radius:10px;
  border:none;
  background:rgba(0,0,0,0.04);
  cursor:pointer;
  color:var(--ink-500);
  transition:all .2s;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.btn-delete:hover{
  background:var(--red-100);
  color:var(--red-600);
  transform:scale(1.1) rotate(5deg);
}
.btn-pin:hover{
  background:var(--amber-100);
  color:var(--amber-600);
  transform:scale(1.1) rotate(-5deg);
}

.announcement-title{
  font-size:17px;
  font-weight:700;
  color:var(--navy-900);
  margin-bottom:12px;
  line-height:1.5;
}
.announcement-content{
  font-size:14px;
  color:var(--ink-700);
  line-height:1.7;
  white-space:pre-wrap;
}
.announcement-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:16px;
  padding-top:16px;
  border-top:1px solid var(--line);
}
.announcement-time{
  font-size:12px;
  color:var(--ink-500);
  display:flex;
  align-items:center;
  gap:6px;
}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-500);}
.empty-state-icon{font-size:48px;margin-bottom:12px;}
.empty-state-text{font-size:15px;font-weight:600;}

/* Modal đăng thông báo hiện đại */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,0.7);
  backdrop-filter:blur(8px);
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:20px;
  animation:fadeIn .3s;
}
.modal.open{display:flex;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.modal-content{
  background:#fff;
  border-radius:24px;
  max-width:650px;
  width:100%;
  max-height:90vh;
  overflow-y:auto;
  box-shadow:0 24px 48px rgba(0,0,0,0.2);
  animation:slideUp .3s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}

.modal-header{
  padding:24px 28px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(135deg,rgba(79,209,197,0.1),rgba(79,109,245,0.1));
}
.modal-title{
  font-size:20px;
  font-weight:700;
  color:var(--navy-900);
  display:flex;
  align-items:center;
  gap:10px;
}
.modal-close{
  padding:10px;
  border:none;
  background:rgba(0,0,0,0.05);
  cursor:pointer;
  border-radius:12px;
  color:var(--ink-500);
  font-size:20px;
  transition:all .2s;
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
}
.modal-close:hover{
  background:var(--red-100);
  color:var(--red-600);
  transform:rotate(90deg);
}
.modal-body{padding:28px;}

.form-group{margin-bottom:24px;}
.form-label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:var(--ink-700);
  margin-bottom:10px;
  letter-spacing:0.3px;
}
.form-input,.form-textarea{
  width:100%;
  padding:14px 16px;
  border:2px solid var(--line);
  border-radius:12px;
  font-family:inherit;
  font-size:14px;
  transition:all .2s;
  background:#fff;
}
.form-input:focus,.form-textarea:focus{
  outline:none;
  border-color:var(--mint-500);
  background:var(--mint-50);
  box-shadow:0 0 0 4px rgba(79,209,197,0.1);
}
.form-textarea{
  min-height:150px;
  resize:vertical;
  line-height:1.6;
}
.form-checkbox{display:flex;align-items:center;gap:10px;margin-top:16px;}
.form-checkbox input{
  width:20px;
  height:20px;
  cursor:pointer;
  accent-color:var(--mint-500);
}

/* Buttons trong modal */
.modal-footer{
  display:flex;
  gap:12px;
  margin-top:32px;
}
.btn-submit{
  flex:1;
  padding:14px 24px;
  background:linear-gradient(135deg,var(--mint-500),var(--sky-500));
  border:none;
  border-radius:12px;
  color:#fff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(79,109,245,0.3);
  transition:all .2s;
}
.btn-submit:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(79,109,245,0.4);
}
.btn-submit:active{
  transform:translateY(0);
}
.btn-cancel-modal{
  padding:14px 24px;
  background:var(--ink-100);
  border:none;
  border-radius:12px;
  color:var(--ink-700);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
}
.btn-cancel-modal:hover{
  background:var(--ink-200);
}

@media (max-width:768px){
  .announcements-header{flex-direction:column;align-items:flex-start;gap:12px;}
  .filter-tabs{width:100%;}
}
</style>
</head>
<body>
<div class="shell">
  <div id="sidebar-slot"></div>
  <main class="main">
    <div id="topbar-slot"></div>
    <div class="content" id="content">

      <div class="announcements-header">
        <div class="announcements-header-left">
          <h1 class="page-title">📢 Thông báo lớp</h1>
          <p class="page-subtitle">Thông tin và cập nhật từ GVCN và ban cán sự</p>
        </div>
        <div class="announcements-header-right">
          <button class="btn-new-announcement" id="btn-new-announcement">
            <span class="icon">✨</span>
            <span>Đăng thông báo</span>
          </button>
        </div>
      </div>

      <div class="filter-tabs" id="filter-tabs">
        <button class="filter-tab active" data-filter="all">
          📋 Tất cả
          <span class="count" id="count-all">0</span>
        </button>
        <button class="filter-tab" data-filter="GVCN">
          👨‍🏫 GVCN
          <span class="count" id="count-gvcn">0</span>
        </button>
        <button class="filter-tab" data-filter="Lớp trưởng">
          👑 Lớp trưởng
          <span class="count" id="count-lt">0</span>
        </button>
        <button class="filter-tab" data-filter="Bí thư">
          📋 Bí thư
          <span class="count" id="count-bt">0</span>
        </button>
        <button class="filter-tab" data-filter="Phó học tập">
          📚 Phó học tập
          <span class="count" id="count-pht">0</span>
        </button>
        <button class="filter-tab" data-filter="Phó lao động">
          🧹 Phó lao động
          <span class="count" id="count-pld">0</span>
        </button>
      </div>

      <div class="announcements-grid" id="announcements-list"></div>

    </div>
  </main>
</div>

<!-- Modal đăng thông báo -->
<div class="modal" id="modal-announcement">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">📝 Đăng thông báo mới</h2>
      <button class="modal-close" id="btn-close-modal">✕</button>
    </div>
    <div class="modal-body">
      <form id="form-announcement">
        <div class="form-group">
          <label class="form-label">📋 Tiêu đề thông báo *</label>
          <input type="text" class="form-input" name="title" placeholder="Ví dụ: Nhắc nhở nộp bài tập tuần 5" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">✍️ Nội dung chi tiết *</label>
          <textarea class="form-textarea" name="content" placeholder="Viết nội dung thông báo đầy đủ và rõ ràng..." required></textarea>
        </div>
        
        <div class="modal-footer">
          <button type="submit" class="btn-submit">🚀 Đăng thông báo</button>
          <button type="button" class="btn-cancel-modal" id="btn-cancel">Hủy</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script type="module">
import { initLayout } from '../assets/js/layout.js';
import { errorBanner, toast } from '../assets/js/ui.js';
import { supabase } from '../assets/js/supabaseClient.js';
import * as announcementService from '../services/announcementService.js';

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let CLASS_ID = null;
let ANNOUNCEMENTS = [];
let CURRENT_FILTER = 'all';
let CAN_POST = false; // Quyền đăng thông báo
let CURRENT_USER = null; // Thông tin user hiện tại

function formatTime(timestamp) {
  const date = new Date(timestamp);
  const now = new Date();
  const diff = now - date;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  
  if (minutes < 1) return 'Vừa xong';
  if (minutes < 60) return `${minutes} phút trước`;
  if (hours < 24) return `${hours} giờ trước`;
  if (days < 7) return `${days} ngày trước`;
  
  return date.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function renderAnnouncements() {
  const filtered = CURRENT_FILTER === 'all' 
    ? ANNOUNCEMENTS 
    : ANNOUNCEMENTS.filter(a => a.position_label === CURRENT_FILTER);
  
  const container = $('#announcements-list');
  
  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <div class="empty-state-text">Chưa có thông báo nào</div>
      </div>`;
    return;
  }
  
  container.innerHTML = filtered.map(a => {
    const isPinned = a.is_pinned ? 'pinned' : '';
    const isImportant = a.is_important ? 'important' : '';
    const positionLabel = a.position_label || 'Thành viên';
    const positionIcon = a.position_icon || '👤';
    const positionColor = a.position_color || 'rgba(79, 109, 245, 0.12)';
    const positionTag = `<span class="position-tag" style="background:${positionColor};">
      ${positionIcon} ${positionLabel}
    </span>`;
    
    // Hiển thị nút xóa nếu là người đăng hoặc admin
    const canDelete = CURRENT_USER && (a.created_by === CURRENT_USER.id || CURRENT_USER.role === 'admin');
    const canPin = CURRENT_USER && CURRENT_USER.role === 'admin';
    
    const deleteBtn = canDelete 
      ? `<button class="btn-delete" data-id="${a.id}" title="Xóa thông báo">🗑️</button>`
      : '';
    
    const pinBtn = canPin
      ? `<button class="btn-pin" data-id="${a.id}" data-pinned="${a.is_pinned}" title="${a.is_pinned ? 'Bỏ ghim' : 'Ghim'}">
           ${a.is_pinned ? '📌' : '📍'}
         </button>`
      : '';
    
    return `
      <div class="announcement-card ${isPinned} ${isImportant}" data-id="${a.id}">
        <div class="announcement-header">
          <div class="announcement-author">
            ${positionTag}
            <span class="author-name">${a.author_name || 'Không rõ'}</span>
          </div>
          <div class="announcement-meta">
            ${a.is_pinned ? '📌 Ghim' : ''}
            ${pinBtn}
            ${deleteBtn}
          </div>
        </div>
        
        <div class="announcement-title">${a.title}</div>
        <div class="announcement-content">${a.content}</div>
        
        <div class="announcement-footer">
          <span class="announcement-time">🕐 ${formatTime(a.created_at)}</span>
        </div>
      </div>`;
  }).join('');
  
  // Add delete event listeners
  $$('.btn-delete').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const announcement = ANNOUNCEMENTS.find(a => a.id === id);
      
      if (!confirm(`Xóa thông báo "${announcement.title}"?`)) return;
      
      try {
        await announcementService.deleteAnnouncement(id);
        toast('✅ Đã xóa thông báo');
        await loadAnnouncements();
      } catch (err) {
        toast('⚠️ Lỗi: ' + err.message, 'err');
      }
    });
  });
  
  // Add pin event listeners
  $$('.btn-pin').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const isPinned = btn.dataset.pinned === 'true';
      
      try {
        await announcementService.togglePinAnnouncement(id, !isPinned);
        toast(isPinned ? '📍 Đã bỏ ghim' : '📌 Đã ghim');
        await loadAnnouncements();
      } catch (err) {
        toast('⚠️ Lỗi: ' + err.message, 'err');
      }
    });
  });
  
  // Update counts
  const counts = {
    all: ANNOUNCEMENTS.length,
    gvcn: ANNOUNCEMENTS.filter(a => a.position_label === 'GVCN').length,
    lt: ANNOUNCEMENTS.filter(a => a.position_label === 'Lớp trưởng').length,
    bt: ANNOUNCEMENTS.filter(a => a.position_label === 'Bí thư').length,
    pht: ANNOUNCEMENTS.filter(a => a.position_label === 'Phó học tập').length,
    pld: ANNOUNCEMENTS.filter(a => a.position_label === 'Phó lao động').length
  };
  
  $('#count-all').textContent = counts.all;
  $('#count-gvcn').textContent = counts.gvcn;
  $('#count-lt').textContent = counts.lt;
  $('#count-bt').textContent = counts.bt;
  $('#count-pht').textContent = counts.pht;
  $('#count-pld').textContent = counts.pld;
}

async function loadAnnouncements() {
  // Quyền đăng phải được kiểm tra trước để admin/teacher không bị chặn bởi lỗi dữ liệu rỗng.
  CAN_POST = await announcementService.canPostAnnouncement(CLASS_ID);
  const btnNew = $('#btn-new-announcement');
  btnNew.style.display = CAN_POST ? 'flex' : 'none';

  try {
    ANNOUNCEMENTS = await announcementService.listAnnouncements(CLASS_ID);
    renderAnnouncements();
  } catch (err) {
    ANNOUNCEMENTS = [];
    renderAnnouncements();
    if (CAN_POST) {
      toast('📢 Chế độ đăng thông báo đang hoạt động, chỉ dữ liệu bảng thông báo chưa sẵn sàng.', 'info');
    } else {
      errorBanner($('#content'), 'Không tải được thông báo: ' + err.message, loadAnnouncements);
    }
  }
}

// Filter tabs
$$('.filter-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    CURRENT_FILTER = tab.dataset.filter;
    renderAnnouncements();
  });
});

// Modal controls
$('#btn-new-announcement').addEventListener('click', () => {
  if (!CAN_POST) {
    toast('⚠️ Bạn không có quyền đăng thông báo.\n\nChỉ GVCN, Lớp trưởng, Bí thư, Phó học tập, Phó lao động mới được đăng thông báo.', 'warn');
    return;
  }
  $('#modal-announcement').classList.add('open');
});

$('#btn-close-modal').addEventListener('click', () => {
  $('#modal-announcement').classList.remove('open');
  $('#form-announcement').reset();
});

$('#btn-cancel').addEventListener('click', () => {
  $('#modal-announcement').classList.remove('open');
  $('#form-announcement').reset();
});

// Submit form
$('#form-announcement').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const formData = new FormData(e.target);
  const data = {
    title: formData.get('title'),
    content: formData.get('content'),
    is_important: false
  };
  
  try {
    await announcementService.createAnnouncement(CLASS_ID, data);
    toast('✅ Đã đăng thông báo');
    $('#modal-announcement').classList.remove('open');
    $('#form-announcement').reset();
    await loadAnnouncements();
  } catch (err) {
    toast('⚠️ Lỗi: ' + err.message, 'err');
  }
});

// Close modal when clicking outside
$('#modal-announcement').addEventListener('click', (e) => {
  if (e.target.id === 'modal-announcement') {
    $('#modal-announcement').classList.remove('open');
  }
});

(async () => {
  const user = await initLayout({ 
    page: 'announcements', 
    title: 'Thông báo', 
    sub: 'Thông tin và cập nhật lớp học', 
    allowedRoles: ['admin', 'teacher', 'student'] 
  });
  if (!user) return;
  
  CURRENT_USER = user; // Lưu thông tin user
  
  // Get class ID
  try {
    // Removed debug logs - use browser devtools if needed
    
    if (user.role === 'admin' || user.role === 'teacher') {
      // Admin/Teacher: get class 12A2 (lấy class mới nhất nếu có nhiều)
      const { data: classData, error: classError } = await supabase
        .from('classes')
        .select('id, name')
        .eq('name', '12A2')
        .order('created_at', { ascending: false })
        .limit(1);
      
      // Query completed
      
      if (classError) throw classError;
      CLASS_ID = classData?.[0]?.id;
    } else {
      // Student: get their class
      const { data: studentData, error: studentError } = await supabase
        .from('students')
        .select('class_id')
        .eq('id', user.id);
      
      // Query completed
      
      if (studentError) throw studentError;
      CLASS_ID = studentData?.[0]?.class_id;
    }
    
    // CLASS_ID determined
    
    if (!CLASS_ID) {
      throw new Error('Không tìm thấy thông tin lớp học. Vui lòng kiểm tra database có class 12A2 chưa.');
    }
    
    await loadAnnouncements();
  } catch (err) {
    console.error('Full error:', err);
    errorBanner($('#content'), 'Lỗi tải dữ liệu: ' + err.message);
  }
})();
</script>
</body>
</html>
